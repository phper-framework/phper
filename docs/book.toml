# The Rust code blocks under `src` are compiled by `cargo test -p doc-tests`
# (see tests/doc-tests), so only use syntax understood by both rustdoc and
# mdBook there: no `{{#include}}` inside code blocks.

[book]
title = "PHPER"
authors = ["PHPER Framework Team"]
description = "The framework that allows us to write PHP extensions using pure and safe Rust whenever possible."
language = "en"
src = "src"

[rust]
edition = "2024"

[output.html]
git-repository-url = "https://github.com/phper-framework/phper"
edit-url-template = "https://github.com/phper-framework/phper/edit/master/docs/{path}"
# Overridden per version by site/build_site.py through
# MDBOOK_OUTPUT__HTML__SITE_URL.
site-url = "/phper/docs/master/"
# The version dropdown, which reads ../versions.json written by
# site/build_site.py.
additional-js = ["assets/version-switcher.js"]
additional-css = ["assets/version-switcher.css"]

[output.html.playground]
runnable = false
