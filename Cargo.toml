[workspace]
resolver = "3"
members = [
    "phper",
    "phper-alloc",
    "phper-build",
    "phper-macros",
    "phper-sys",
    "phper-test",

    # internal
    "examples/*",
    "tests/doc-tests",
    "tests/integration",
]

[workspace.package]
authors = ["PHPER Framework Team", "jmjoy <jmjoy@apache.org>"]
edition = "2024"
license = "MulanPSL-2.0 OR Apache-2.0 OR MIT"
repository = "https://github.com/phper-framework/phper"
rust-version = "1.85"

[workspace.dependencies]
phper = { version = "0.19.0", path = "./phper" }
phper-alloc = { version = "0.17.0", path = "./phper-alloc" }
phper-build = { version = "0.16.0", path = "./phper-build" }
phper-macros = { version = "0.16.0", path = "./phper-macros" }
phper-sys = { version = "0.17.0", path = "./phper-sys" }
phper-test = { version = "0.17.0", path = "./phper-test" }
